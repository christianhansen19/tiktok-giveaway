<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Giveaway Admin</title>
<style>
  :root { --bg:#fffaf5; --fg:#1f2430; --muted:#6b7280; --card:#ffffff; --line:#eadfd3; --accent:#c8102e; --ok:#1a7f4b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#14171f; --fg:#f2f2f2; --muted:#9aa3b2; --card:#1d212b; --line:#2b3140; --accent:#ff5470; --ok:#4ade80; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0 0 16px; font-size:1.6rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:8px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--bg); color:var(--fg); }
  button { font:inherit; font-weight:600; padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; margin:4px 4px 4px 0; }
  button.alt { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .status { font-weight:600; }
  .live { color:var(--ok); }
  .msg { margin-top:10px; color:var(--muted); word-break:break-word; }
  .err { color:var(--accent); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>🎛️ Giveaway Admin</h1>

  <div class="card" id="login">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button id="signin">Sign in</button>
    <div class="msg err" id="loginErr"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div>Status: <span class="status" id="state">…</span></div>
      <div id="stats" class="msg"></div>
      <button id="start">▶ Start giveaway</button>
      <button id="stop" class="alt">■ Stop giveaway</button>
    </div>

    <div class="card">
      <b>Pick the winner</b>
      <p class="msg">Stop the giveaway first. One winner, weighted by coins.</p>
      <button id="draw">🎁 Draw winner</button>
      <div class="msg" id="drawOut"></div>
    </div>

    <div class="card">
      <b>Fix a coin total</b>
      <p class="msg">For a missed or double-counted gift. Use a negative number to remove coins.</p>
      <label for="uid">Viewer (pick from board)</label>
      <select id="uid" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--fg)"></select>
      <label for="coins">Coins to add (or subtract)</label>
      <input id="coins" type="number" inputmode="numeric">
      <label for="note">Note</label>
      <input id="note" type="text">
      <button id="adjust" class="alt">Apply</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</main>
<script>
  // Set to your deployed API URL (no trailing slash). Same value as in index.html.
  const API = 'https://YOUR-APP.up.railway.app';
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat();
  let pw = null;
  try { pw = sessionStorage.getItem('gw_pw'); } catch {}

  async function call(action, body) {
    const r = await fetch(`${API}/admin/${action}`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${pw}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body ?? {}),
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error('Wrong password');
    if (!r.ok) throw new Error(data.error || `Error ${r.status}`);
    return data;
  }

  async function refresh() {
    try {
      const d = await (await fetch(API + '/leaderboard', { cache: 'no-store' })).json();
      $('state').textContent = d.active ? 'RUNNING' : 'Stopped';
      $('state').className = 'status' + (d.active ? ' live' : '');
      $('stats').textContent = `${fmt.format(d.totalCoins)} coins from ${d.viewers} supporters`
        + (d.winner ? ` · Winner: ${d.winner.nickname}` : '');
      const cur = $('uid').value;
      $('uid').innerHTML = d.board.map((r) =>
        `<option value="${r.userId}" data-n="${encodeURIComponent(r.nickname ?? '')}">${(r.nickname ?? r.userId).replace(/</g,'&lt;')} (${fmt.format(r.coins)})</option>`).join('');
      if (cur) $('uid').value = cur;
    } catch { $('stats').textContent = 'Can’t reach the server.'; }
  }

  function say(text, isErr) { $('msg').textContent = text; $('msg').className = 'msg' + (isErr ? ' err' : ''); }
  async function run(fn) {
    try { await fn(); await refresh(); } catch (e) { say(e.message, true); }
  }

  async function enter() {
    $('login').classList.add('hidden');
    $('panel').classList.remove('hidden');
    await refresh();
    setInterval(refresh, 7000);
  }

  $('signin').onclick = async () => {
    pw = $('pw').value;
    $('loginErr').textContent = '';
    try {
      await call('check'); // 404 for unknown action once authenticated; 401 if wrong
    } catch (e) {
      if (e.message === 'Wrong password') { $('loginErr').textContent = e.message; return; }
    }
    try { sessionStorage.setItem('gw_pw', pw); } catch {}
    enter();
  };
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('signin').click(); });

  $('start').onclick = () => {
    if (!confirm('Start a NEW giveaway? Coin totals reset to zero.')) return;
    run(async () => { await call('start'); say('Giveaway started.'); });
  };
  $('stop').onclick = () => run(async () => { await call('stop'); say('Giveaway stopped.'); });
  $('draw').onclick = () => {
    if (!confirm('Draw the winner now? This is logged and cannot be undone.')) return;
    run(async () => {
      const r = await call('draw');
      $('drawOut').textContent = `🏆 ${r.winner.nickname} (${fmt.format(r.winner.coins)} coins, ${(r.winner.odds * 100).toFixed(1)}% chance). Seed: ${r.seed}`;
    });
  };
  $('adjust').onclick = () => run(async () => {
    const opt = $('uid').selectedOptions[0];
    if (!opt) throw new Error('No viewer selected');
    const coins = Number($('coins').value);
    if (!Number.isFinite(coins) || coins === 0) throw new Error('Enter a coin amount');
    await call('adjust', { userId: opt.value, nickname: decodeURIComponent(opt.dataset.n), coins, note: $('note').value });
    $('coins').value = ''; $('note').value = '';
    say('Adjustment saved.');
  });

  if (pw) enter();
</script>
</body>
</html>
